name: portable-review-gates

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: portable-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node.js 24)
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Download exact hashed execution wheel
        run: >-
          python -m pip download
          --require-hashes
          --dest /tmp/nautilus-locked-wheel
          -r requirements.lock.txt
      - name: Verify downloaded wheel identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          lock = json.loads(Path("runtime.lock.json").read_text(encoding="utf-8"))
          wheels = tuple(Path("/tmp/nautilus-locked-wheel").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert wheel.name == lock["nautilus_wheel_filename"]
          assert wheel.stat().st_size == lock["nautilus_wheel_size_bytes"]
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == lock["nautilus_wheel_sha256"]
          PY
      - name: Install exact local wheel without network fallback
        run: >-
          python -m pip install
          --no-index
          --find-links /tmp/nautilus-locked-wheel
          --require-hashes
          -r requirements.lock.txt
      - name: Verify dependency graph
        run: python -m pip check
      - name: Verify installed RECORD and payload identity
        run: |
          python - <<'PY'
          from pathlib import Path

          from crypto_lab.config import RuntimeLock
          from crypto_lab.runtime import collect_runtime_identity

          root = Path.cwd()
          lock = RuntimeLock.from_json_bytes((root / "runtime.lock.json").read_bytes())
          observed = collect_runtime_identity(
              dependency_lock_path=root / "requirements.lock.txt",
          )
          assert observed["nautilus_version"] == lock.nautilus_version
          assert observed["installed_payload_sha256"] == lock.nautilus_installed_payload_sha256
          assert observed["installed_payload_file_count"] == lock.nautilus_installed_payload_file_count
          assert observed["installed_native_extension_count"] > 0
          assert observed["installed_files_verified"] is True
          PY
      - name: Compile tracked Python sources
        run: python -m compileall -q src scripts tests
      - name: Check authored-source whitespace
        run: git diff --check ${{ github.event.pull_request.base.sha || github.event.before }} HEAD
      - name: Run portable audit regressions
        run: >-
          python -m unittest -v
          tests.unit.test_comprehensive_audit_regressions.AuditRegressionTests.test_owner_child_uses_single_cli_module_identity
          tests.unit.test_comprehensive_audit_regressions.AuditRegressionTests.test_f009_failure_code_vocabulary_exactly_matches_ssot_section_15
          tests.unit.test_comprehensive_audit_regressions.AuditRegressionTests.test_f007_utc_conversion_uses_exact_integer_arithmetic
          tests.unit.test_comprehensive_audit_regressions.AuditRegressionTests.test_f005_mark_converter_rejects_cross_instrument_relabel
          tests.unit.test_comprehensive_audit_regressions.AuditRegressionTests.test_f005_funding_converter_rejects_cross_instrument_relabel
          tests.unit.test_comprehensive_audit_regressions.AuditRegressionTests.test_f001_historical_impossible_spot_benchmark_is_financially_rejected
          tests.unit.test_audit_research_validator.AuditResearchValidatorTests.test_missing_raw_source_diagnostic_remains_fail_closed
          tests.adversarial.test_aud006_source_revision.Aud006SourceRevisionTests.test_historical_source_revision_accepts_merge_commit_and_rejects_squash
          tests.unit.test_engine_data_window.EngineDataWindowTests.test_spot_release_larger_than_run_is_filtered_before_engine_boundary
          tests.unit.test_engine_data_window.EngineDataWindowTests.test_perpetual_boundary_keeps_final_mark_but_excludes_funding_at_end
          tests.unit.test_historical_contracts
          tests.unit.test_instrument_representation_funding_checker_repair
          tests.unit.test_m4_multiprocess_locking
          tests.unit.test_profile_authority
          tests.unit.test_result_status
          tests.unit.test_runtime_installed_files
          tests.unit.test_spot_cash_reconciliation.SpotCashReconciliationTests.test_nonfinancial_account_snapshot_before_fill_is_allowed_but_bound_exactly
          tests.unit.test_timestamps

# This workflow is intentionally not the Official acceptance runner. It proves
# the locked wheel and installed payload, then runs only host-portable tests.
# The seven synthetic engine tests which require the exact host-specific
# Runtime Lock, and evidence checks which reopen the preserved untracked raw-data
# corpus, remain mandatory in scripts/run_audit_remediation_acceptance.py. CI
# must not bypass/rewrite that lock or silently omit source objects to look
# Official.
