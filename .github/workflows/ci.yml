name: portable-review-gates

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: portable-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install hashed execution dependency
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: Verify dependency graph
        run: python -m pip check
      - name: Compile tracked Python sources
        run: python -m compileall -q src scripts tests
      - name: Run portable audit regressions
        run: >-
          python -m unittest -v
          tests.unit.test_comprehensive_audit_regressions
          tests.unit.test_engine_data_window
          tests.unit.test_historical_contracts
          tests.unit.test_instrument_representation_funding_checker_repair
          tests.unit.test_m4_multiprocess_locking
          tests.unit.test_result_status
          tests.unit.test_runtime_installed_files
          tests.unit.test_spot_cash_reconciliation
          tests.unit.test_timestamps

# This workflow is intentionally not the Official acceptance runner. The
# host-specific Runtime Lock and large, untracked market-data catalogs are
# qualified offline by scripts/run_audit_remediation_acceptance.py.
